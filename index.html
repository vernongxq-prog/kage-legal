<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>ペラペラ日本語 — Legal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #F5F1EA;
    color: #2D2A26;
    font-family: 'Hiragino Sans', 'PingFang SC', 'Helvetica Neue', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border: 1px solid #E8E0D2;
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 30px rgba(30, 58, 95, 0.06);
  }
  .logo {
    width: 80px; height: 80px;
    margin: 0 auto 24px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(30, 58, 95, 0.12);
  }
  .logo svg { width: 100%; height: 100%; display: block; }
  h1 {
    font-family: 'Hiragino Mincho ProN', 'Songti SC', Georgia, serif;
    font-size: 28px;
    font-weight: 600;
    color: #1E3A5F;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    font-size: 14px;
    color: #8B857C;
    margin-bottom: 32px;
    letter-spacing: 0.05em;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #F5F1EA;
    border: 1px solid #E8E0D2;
    color: #1E3A5F;
    padding: 16px 20px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .link:hover {
    background: #fff;
    border-color: #C56B6B;
    transform: translateY(-1px);
  }
  .link-label { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .link-label .secondary { font-size: 12px; color: #8B857C; font-weight: 400; }
  .arrow { color: #C56B6B; font-size: 20px; }
  .footer {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid #E8E0D2;
    font-size: 12px;
    color: #8B857C;
  }
  .footer a { color: #5A5651; text-decoration: none; }
  .footer a:hover { color: #C56B6B; }
</style>
</head>

<div class="card">

  <div class="links">

      </span>
      <span class="arrow">›</span>
    </a>
    <a href="terms.html" class="link">
      <span class="link-label">
        <span>Terms of Service</span>
        <span class="secondary">利用規約 · 服务条款</span>
      </span>
      <span class="arrow">›</span>
    </a>
    <a href="mailto:vernongxq@gmail.com" class="link">
      <span class="link-label">
        <span>Contact &amp; Support</span>
        <span class="secondary">お問い合わせ · 联系支持</span>
      </span>
      <span class="arrow">›</span>
    </a>
  </div>

  <div class="footer">
    © 2026 <a href="mailto:vernongxq@gmail.com">tepgu consulting K.K.</a>
